<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Dice Body -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#diceGrad)" filter="url(#shadow)" />
  
  <!-- Dots (5-pattern) -->
  <circle cx="160" cy="160" r="34" fill="#0f0f13" />
  <circle cx="352" cy="160" r="34" fill="#0f0f13" />
  <circle cx="256" cy="256" r="34" fill="#0f0f13" />
  <circle cx="160" cy="352" r="34" fill="#0f0f13" />
  <circle cx="352" cy="352" r="34" fill="#0f0f13" />
</svg>
