<mat-sidenav-container class="app-container">
  <mat-sidenav [mode]="isDesktop() ? 'side' : 'over'" [opened]="isDesktop()" class="app-sidenav">
    <div class="sidenav-header">
      <div class="logo">
        <span class="logo-icon">🎲</span>
        <span class="logo-text">Spieleabend</span>
      </div>
    </div>
    <mat-nav-list class="nav-list">
      @for (item of navItems; track item.path) {
        <a mat-list-item
           [routerLink]="item.path"
           routerLinkActive="active-link"
           class="nav-item">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
    <div class="sidenav-footer">
      <span class="footer-text">Spieleabend Tracker</span>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    @if (!isDesktop()) {
      <div class="mobile-header">
        <span class="logo-icon">🎲</span>
        <span class="mobile-title">Spieleabend</span>
      </div>
    }

    <div class="main-content-scroll">
      <router-outlet />
    </div>

    @if (!isDesktop()) {
      <nav class="mobile-nav-bar">
        @for (item of navItems; track item.path) {
          <a [routerLink]="item.path"
             routerLinkActive="mobile-active-link"
             class="mobile-nav-item">
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    }
  </mat-sidenav-content>
</mat-sidenav-container>
